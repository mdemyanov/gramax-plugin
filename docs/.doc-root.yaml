# .doc-root.yaml — объявления свойств корня docs/. После flip Ф9 (NA-EPIC-83) дефолтный
# корень валидации scripts/validate-content.py — docs/ (первый существующий из пары,
# одно-корневая валидация). Типы План/Спека/Гайд/Прочее — честные метки легасных
# артефактов рабочих процессов (superpowers, 2026-05…2026-08), а не подгонка под каталог
# типов content/. Своё дерево — своя калибровка (ADR-031).
code: GRAMAX-PLUGIN-DOCS
title: Документы
description: Внутренние документы репозитория gramax-marketplace
language: ru
syntax: XML
editors:
  - qutask@gmail.com
properties:
  - name: Тип контента
    type: Enum
    values: [План, Спека, Гайд, Прочее, ADR, Урок]
  - name: Статус
    type: Enum
    values: [Draft, Active, Accepted, Superseded, Historical, Done]
filterProperties: [Тип контента, Статус]
