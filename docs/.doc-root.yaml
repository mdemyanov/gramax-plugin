# .doc-root.yaml — объявления свойств ЕДИНСТВЕННОГО корня каталога docs/ (FR-128,
# ADR-0021 Решение 1: слияние doc-roots). Идентичность — от корня content/
# (code: GRAMAX-PLUGIN, title, description); модель свойств — объединение обоих
# корней. Enum «Тип контента» триммирован до живых значений (коммит D3, ADR-0021
# Решение 1): после удалений FR-129 и переезда носителей у План/Спека/Прочее/
# Приёмка не осталось; пустых значений в enum нет.
# Калибровка схемы — ADR-031: канон носит дерево плагина nauta
# (content/40-architecture/ADR-031-…, templates/content-scaffold/.doc-root.yaml),
# не путь этого дерева.
code: GRAMAX-PLUGIN
title: Gramax Marketplace
description: Документация плагина gramax для Claude Code
language: ru
syntax: XML
editors:
  - qutask@gmail.com
properties:
  - name: Тип контента
    type: Enum
    values: [ADR, Требование, Research, Тест-отчёт, Урок, Архитектура, Гайд]
  - name: Статус
    type: Enum
    values: [Draft, Active, Accepted, Superseded, Historical, Done]
  - name: Плагин
    type: Enum
    values: [gramax, marketplace]
filterProperties: [Тип контента, Статус, Плагин]
